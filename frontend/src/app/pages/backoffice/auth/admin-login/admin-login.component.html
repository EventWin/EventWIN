<div class="admin-auth">
  <div class="admin-panel">
    <div class="logo">Event<em>Twin</em> Admin</div>
    <h2>Accès Backoffice Suprême</h2>
    <p>Seul l'administrateur système peut se connecter ici pour gérer les comptes Organisateurs.</p>
    
    <div class="field mt">
      <label>Email Admin</label>
      <input type="email" class="in" [(ngModel)]="email" placeholder="admin@eventtwin.com">
    </div>
    
    <div class="field">
      <label>Mot de passe</label>
      <div class="in-wrap">
        <input [type]="passwordVisible ? 'text' : 'password'" class="in" [(ngModel)]="password" placeholder="••••••••" (keyup.enter)="onLogin()">
        <button type="button" class="eye" (click)="passwordVisible = !passwordVisible" [attr.aria-label]="passwordVisible ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
          <svg *ngIf="!passwordVisible" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg *ngIf="passwordVisible" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>
    
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button class="btn btn-ai btn-lg" (click)="onLogin()">Accéder au Backoffice</button>
  </div>
</div>
