<div class="auth">
  <div class="auth-story">
    <div class="logo" style="margin-bottom: 30px; text-align: left;">
      <img src="/assets/images/logo-eventtwin.png" alt="EventTwin Logo" style="height: 100px;">
    </div>
    <div style="margin-top: 40px;">
      <h1 class="auth-head">Bienvenue dans l'espace <span>Organisateur</span>.</h1>
      <p class="auth-sub">Accédez à vos jumeaux numériques, lancez des simulations IA et maîtrisez le budget de votre événement.</p>
    </div>
    
    <div class="stage" style="margin-top: 40px; display: flex; justify-content: center;">
      <img src="/assets/images/mascot.svg" alt="Twin Mascot" width="320" height="320">
    </div>
  </div>
  <div class="auth-panel">
    <div class="auth-card">
      <h2>Connexion Organisateur</h2>
      <p>Accès strictement réservé aux partenaires EventTwin.</p>
      
      <div class="field">
        <label for="lg-mail">Adresse e-mail professionnelle</label>
        <input class="in" id="lg-mail" type="email" [(ngModel)]="email" (keyup.enter)="onLogin()" placeholder="admin@votre-entreprise.com" autocomplete="email">
      </div>
      
      <div class="field">
        <label for="lg-pass">Mot de passe</label>
        <div class="in-wrap">
          <input class="in" id="lg-pass" [type]="passwordVisible ? 'text' : 'password'" [(ngModel)]="password" (keyup.enter)="onLogin()" placeholder="Votre mot de passe" autocomplete="current-password">
          <button type="button" class="eye" (click)="passwordVisible = !passwordVisible" [attr.aria-label]="passwordVisible ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
            <svg *ngIf="!passwordVisible" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="passwordVisible" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      
      <div class="inline" style="justify-content: flex-end;">
        <a class="link" routerLink="/forgot">Mot de passe oublié ?</a>
      </div>
      
      <p class="error" style="color: #ff4d4d; font-weight: bold; margin-bottom: 15px;" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button class="btn btn-ai btn-lg" [disabled]="loading" (click)="onLogin()">{{ loading ? 'Connexion en cours…' : 'Accéder au Dashboard' }}</button>
      
      <p class="alt" style="margin-top: 25px;">
        <a class="link" routerLink="/">Retour à l'accueil</a>
      </p>
    </div>
  </div>
</div>
