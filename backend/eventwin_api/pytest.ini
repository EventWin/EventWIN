[pytest]
# Réglages normaux : pytest-django crée une base de test séparée
# (« test_eventwin »). Ne PAS utiliser eventwin_api.test_settings ici : ce
# fichier fait pointer la base de test sur la base réelle (usage --keepdb
# avec le runner Django uniquement) et pytest-django la recréerait, vide.
DJANGO_SETTINGS_MODULE = eventwin_api.settings
pythonpath = .
python_files = tests.py test_*.py *_tests.py
