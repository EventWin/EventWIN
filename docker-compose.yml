services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-eventwin}
      POSTGRES_USER: ${DB_USER:-eventwin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventwin}
    ports:
      - '5432:5432'
    volumes:
      - eventwin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-eventwin} -d ${DB_NAME:-eventwin}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/eventwin_api
    env_file:
      - ./backend/eventwin_api/.env.example
    environment:
      DOTENV_OVERRIDE: 'false'
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend/eventwin_api:/app
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  eventwin_postgres_data: